# Local MongoDB as a single-node replica set (transactions need one), for `pnpm dev`.
#   docker compose up -d        then MONGODB_URI=mongodb://127.0.0.1:27017/?replicaSet=rs0&directConnection=true
services:
  mongo:
    image: mongo:8
    container_name: labs-admin-mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - labs-admin-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]}).ok }"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 5s

volumes:
  labs-admin-mongo:
